name: CoffeeOS validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffeeos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coffeeos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: apps/web

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coffeeos_ci?schema=public
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run db:verify-history
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:prepare-migrations
      - run: npm run db:migrate
      - run: npm run db:status
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build:clean
